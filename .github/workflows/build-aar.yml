name: Build AAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.0"

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release AAR
        run: ./gradlew :gifski:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: gifski-release-aar
          path: gifski/build/outputs/aar/*.aar

      - name: Publish the AAR to the "aar" branch
        run: |
          mkdir -p /tmp/out && cp gifski/build/outputs/aar/gifski-release.aar /tmp/out/gifski-release.aar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan aar
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/gifski-release.aar .
          git add gifski-release.aar
          git commit -m "gifski release AAR from ${GITHUB_SHA}"
          git push -f origin aar
